[package]
name = "wandering_inn_scraper"
version = "2.2.0"
edition = "2018"
description = "A scraper for the web serial The Wandering Inn"
authors = ["Frederic Sauve-Hoover"]
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wandering_inn_scraper"
path = "src/lib.rs"

[package.metadata.bundle]
identifier = "rsauvehoover/wandering-inn-scraper"
resources = ["src/assets", "src/font"]
linux_use_terminal = true

[profile.release]
opt-level = 2

[dependencies]
color-name = "1.1.0"
epub-builder = "0.8.3"
hex = "0.4.3"
reqwest = { version = "0.13", features = ["cookies"] }
image = "0.24.7"
imageproc = "0.23.0"
mail-builder = "0.5.0"
mail-send = "0.6.2"
regex = "1.9.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusttype = "0.9.3"
serde = "1.0.180"
serde_json = "1.0.104"
soup = "0.5.1"
tokio = { version = "1.29.1", features = ["full"] }
thiserror = "2.0"
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs", "trace", "limit"] }
maud = { version = "0.27.0", features = ["axum"] }
ammonia = "4.1.4"
argon2 = "0.6.0"
rand = "0.10.2"
percent-encoding = "2.3.2"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serial_test = "4.0.1"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
