name: Release

on: workflow_dispatch

concurrency:
  group: build-main-${{ github.event.repository.name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  create-release:
    runs-on: ubuntu-latest
    needs: pre-checks
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - uses: actions/checkout@v3
      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          draft: true
          prerelease: true 

  bundle-linux:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Install cargo-bundle
        run: cargo install cargo-bundle
      - name: Build
        run: cargo bundle --release
      - name: Tar bundle
        run: |
          deb_file=$(basename target/release/bundle/deb/*.deb)
          tar -czvf "$deb_file.tar.gz" -C target/release/bundle/deb "$deb_file"
          echo "ARTIFACT_NAME=$deb_file.tar.gz" >> $GITHUB_ENV
      - name: upload linux artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ env.ARTIFACT_NAME }}
          asset_name: ${{ env.ARTIFACT_NAME }}
          asset_content_type: application/gzip

  bundle-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - name: Get cargo wix
        run: cargo install cargo-wix
      - name: Build
        run: cargo wix -v
      - name: Get artifact name
        run: |
          artifact_name=$(dir -n -file target/wix/*.msi)
          echo "WINDOWS_ARTIFACT_NAME=$artifact_name" >> $GITHUB_ENV
      - name: upload linux artifact
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./target/wix/${{ env.WINDOWS_ARTIFACT_NAME }}
          asset_name: ${{ env.WINDOWS_ARTIFACT_NAME }}
          asset_content_type: application/gzip
